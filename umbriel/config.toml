# ~/.config/umbriel/config.toml

# ============================================================================
# INCLUDES (docs.noctalia.dev/umbriel/configuration/)
# ============================================================================
[include.optional]
files = [
  "noctalia.toml",
]

# ============================================================================
# GENERAL (docs.noctalia.dev/umbriel/configuration/)
# ============================================================================
[general]
mod_key = "Super"
xwayland = true
xwayland_native_resolution = false
xwayland_xsettings = true
show_cheatsheet = false
focus_on_activate = false
attach_modal_dialogs = true

autostart = [
  "noctalia",
  "steam",
  "discord",
  "ferdium",
  "kdeconnect-indicator",
  "sh -c 'wl-paste --type text --watch cliphist store'",
  "sh -c 'wl-paste --type image --watch cliphist store'",
  "sh -c 'wl-clip-persist --clipboard regular --reconnect-tries 0'"
]

# ============================================================================
# VARIABLES DE ENTORNO
# ============================================================================
[environment]
QT_QPA_PLATFORMTHEME = "qt6ct"
QT_WAYLAND_DISABLE_WINDOWDECORATION = "1"
QT_QPA_PLATFORM = "wayland;xcb"
QT_AUTO_SCREEN_SCALE_FACTOR = "1"
GDK_BACKEND = "wayland,x11,*"
SDL_VIDEODRIVER = "wayland,x11"
CLUTTER_BACKEND = "wayland"

# ============================================================================
# MONITOR (docs.noctalia.dev/umbriel/outputs/)
# ============================================================================
[output.HDMI-A-1]
mode = "1920x1080@74.97"
position = [0, 0]
scale = 1.0
transform = "normal"
direct_scanout = true
tearing = true

# ============================================================================
# INPUT, CURSOR Y FOCO (docs.noctalia.dev/umbriel/input/)
# ============================================================================
[input]
middle_click_paste = false

[input.keyboard]
layout = "us"
variant = "altgr-intl"
numlock_toggle = true

[input.cursor]
theme = "Bibata-Modern-Ice"
size = 22
follows_focus = true

[input.focus]
follows_mouse = true
follows_mouse_max_scroll = 0.40

# ============================================================================
# LAYOUT SCROLLING (docs.noctalia.dev/umbriel/layout/)
# ============================================================================
[layout]
mode = "scrolling"
gap = 5
extent_presets = [0.3, 0.4, 0.6]

[layout.scrolling]
default_extent_fraction = 0.6
center_focused = "never"
center_underfull_strip = true

[layout.struts]
left = 5
right = 5
top = 5
bottom = 5

# ============================================================================
# APARIENCIA, SOMBRAS Y BLUR (docs.noctalia.dev/umbriel/appearance/)
# ============================================================================
[colors]
insert_hint = "#cba6f780"
shadow = "#11111bee"

[colors.border]
focused = "#cba6f7"
unfocused = "#1e1e2e"

[appearance]
prefer_no_csd = true
border_width = 2
corner_radius = 10

[appearance.shadow]
enabled = true
softness = 4
offset_x = 0
offset_y = 2

[appearance.blur]
enabled = true
optimized = true
passes = 3
radius = 3
noise = 0.02
brightness = 0.9
contrast = 0.9
saturation = 1.1

# ============================================================================
# REGLAS DE VENTANAS (docs.noctalia.dev/umbriel/window-rules/)
# ============================================================================
[[window_rule]]
blur = true
blur_optimized = true

[[window_rule]]
match.app_id = "^xdg-desktop-portal-gtk$"
border_width = 0
shadow = false

[[window_rule]]
match.app_id = "^dev.noctalia.Noctalia$"
default_floating = true
default_floating_size_px = { width = 1080, height = 920 }

[[window_rule]]
match.is_alone = true
default_maximize = true

[[window_rule]]
match.content_type = "game"
confine_pointer = true

[[window_rule]]
match.app_id = "^(com[.]obsproject[.]Studio|obs)$"
background_render = true

[[layer_rule]]
match.namespace = "^noctalia-(bar-[^\"]+|notification|dock|panel|attached-panel|osd)$"
blur = true
blur_ignore_alpha = 0.5
blur_optimized = false

# ============================================================================
# ATAJOS DE TECLADO (docs.noctalia.dev/umbriel/keybinds/ y actions/)
# ============================================================================
[keybinds]
# Aplicaciones y paneles de Noctalia
"Mod+Return" = "spawn:foot"
"Mod+B" = "spawn:zen-browser"
"Mod+E" = "spawn:nautilus"
"Mod" = { action = "spawn:noctalia msg panel-toggle launcher", repeat = false }
"Mod+D" = { action = "spawn:noctalia msg panel-toggle launcher", repeat = false }
"Mod+Space" = { action = "spawn:noctalia msg panel-toggle launcher", repeat = false }
"Mod+S" = { action = "spawn:noctalia msg panel-toggle control-center", repeat = false }
"Mod+Shift+Comma" = { action = "spawn:noctalia msg settings-toggle", repeat = false }
"Alt+Tab" = { action = "spawn:noctalia msg window-switcher", repeat = false }
"Mod+V" = { action = "spawn:noctalia msg panel-toggle clipboard", repeat = false }

# Multimedia y Control de Sistema
"XF86AudioRaiseVolume" = { action = "spawn:noctalia msg volume-up", allow_when_locked = true }
"XF86AudioLowerVolume" = { action = "spawn:noctalia msg volume-down", allow_when_locked = true }
"XF86AudioMute" = { action = "spawn:noctalia msg volume-mute", allow_when_locked = true, repeat = false }
"XF86AudioMicMute" = { action = "spawn:wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle", allow_when_locked = true, repeat = false }
"XF86AudioPlay" = { action = "spawn:noctalia msg media toggle", allow_when_locked = true, repeat = false }
"XF86AudioStop" = { action = "spawn:playerctl stop", allow_when_locked = true, repeat = false }
"XF86AudioPrev" = { action = "spawn:noctalia msg media previous", allow_when_locked = true }
"XF86AudioNext" = { action = "spawn:noctalia msg media next", allow_when_locked = true }
"XF86MonBrightnessUp" = { action = "spawn:noctalia msg brightness-up", allow_when_locked = true }
"XF86MonBrightnessDown" = { action = "spawn:noctalia msg brightness-down", allow_when_locked = true }

# Sesión y Ventanas
"Mod+Shift+Slash" = { action = "cheatsheet-toggle", repeat = false }
"Mod+O" = { action = "overview-toggle", repeat = false }
"Mod+Q" = { action = "window-close", repeat = false }
"Mod+Shift+E" = { action = "session-quit", repeat = false }
"Ctrl+Alt+Delete" = { action = "session-quit", repeat = false }
"Mod+Shift+P" = { action = "dpms-off", repeat = false }
"Mod+Escape" = { action = "shortcuts-inhibit-toggle", allow_when_inhibited = true, repeat = false }

# Movimiento de foco (Flechas e inverted-T / Vim keys)
"Mod+Left" = "window-focus-left"
"Mod+Right" = "window-focus-right"
"Mod+Down" = "window-focus-down"
"Mod+Up" = "window-focus-up"
"Mod+H" = "window-focus-left"
"Mod+L" = "window-focus-right"
"Mod+J" = "window-focus-down"
"Mod+K" = "window-focus-up"
"Mod+Home" = "column-focus-first"
"Mod+End" = "column-focus-last"

# Mover columnas y ventanas dentro de columna
"Mod+Shift+Left" = "column-move-left"
"Mod+Shift+Right" = "column-move-right"
"Mod+Shift+Down" = "window-move-down"
"Mod+Shift+Up" = "window-move-up"
"Mod+Shift+H" = "column-move-left"
"Mod+Shift+L" = "column-move-right"
"Mod+Shift+J" = "window-move-down"
"Mod+Shift+K" = "window-move-up"
"Mod+Shift+Home" = "column-move-to-first"
"Mod+Shift+End" = "column-move-to-last"

# Mover y enfocar entre monitores
"Mod+Ctrl+Left" = "output-focus-left"
"Mod+Ctrl+Right" = "output-focus-right"
"Mod+Ctrl+Down" = "output-focus-down"
"Mod+Ctrl+Up" = "output-focus-up"
"Mod+Ctrl+H" = "output-focus-left"
"Mod+Ctrl+L" = "output-focus-right"
"Mod+Ctrl+J" = "output-focus-down"
"Mod+Ctrl+K" = "output-focus-up"

"Ctrl+Alt+Left" = "window-move-to-output-left"
"Ctrl+Alt+Right" = "window-move-to-output-right"
"Ctrl+Alt+Down" = "window-move-to-output-down"
"Ctrl+Alt+Up" = "window-move-to-output-up"
"Ctrl+Alt+H" = "window-move-to-output-left"
"Ctrl+Alt+L" = "window-move-to-output-right"
"Ctrl+Alt+J" = "window-move-to-output-down"
"Ctrl+Alt+K" = "window-move-to-output-up"

# Workspaces (Focus y Mover)
"Mod+Page_Down" = "workspace-next"
"Mod+Page_Up" = "workspace-previous"
"Mod+U" = "workspace-next"
"Mod+I" = "workspace-previous"
"Mod+Tab" = "workspace-focus-last"

"Mod+Shift+Page_Down" = "column-move-to-workspace-next"
"Mod+Shift+Page_Up" = "column-move-to-workspace-previous"
"Mod+Shift+U" = "column-move-to-workspace-next"
"Mod+Shift+I" = "column-move-to-workspace-previous"

"Mod+Ctrl+Page_Down" = "workspace-move-down"
"Mod+Ctrl+Page_Up" = "workspace-move-up"
"Mod+Ctrl+U" = "workspace-move-down"
"Mod+Ctrl+I" = "workspace-move-up"

# Scroll con rueda
"Mod+WheelDown" = { action = "workspace-next", cooldown_ms = 150 }
"Mod+WheelUp" = { action = "workspace-previous", cooldown_ms = 150 }
"Mod+Ctrl+WheelDown" = { action = "column-move-to-workspace-next", cooldown_ms = 150 }
"Mod+Ctrl+WheelUp" = { action = "column-move-to-workspace-previous", cooldown_ms = 150 }

"Mod+WheelRight" = "window-focus-right"
"Mod+WheelLeft" = "window-focus-left"
"Mod+Ctrl+WheelRight" = "column-move-right"
"Mod+Ctrl+WheelLeft" = "column-move-left"

# Workspaces fijos 1 al 9
"Mod+1" = "workspace-switch:1"
"Mod+2" = "workspace-switch:2"
"Mod+3" = "workspace-switch:3"
"Mod+4" = "workspace-switch:4"
"Mod+5" = "workspace-switch:5"
"Mod+6" = "workspace-switch:6"
"Mod+7" = "workspace-switch:7"
"Mod+8" = "workspace-switch:8"
"Mod+9" = "workspace-switch:9"

"Alt+1" = "column-move-to-workspace:1"
"Alt+2" = "column-move-to-workspace:2"
"Alt+3" = "column-move-to-workspace:3"
"Alt+4" = "column-move-to-workspace:4"
"Alt+5" = "column-move-to-workspace:5"
"Alt+6" = "column-move-to-workspace:6"
"Alt+7" = "column-move-to-workspace:7"
"Alt+8" = "column-move-to-workspace:8"
"Alt+9" = "column-move-to-workspace:9"

# Apilado, pestañas y tamaño de columnas
"Mod+BracketLeft" = "window-consume-or-expel-left"
"Mod+BracketRight" = "window-consume-or-expel-right"
"Mod+Comma" = "window-consume-from-right"
"Mod+Period" = "window-consume-right"

"Mod+R" = "window-cycle-primary-extent"
"Mod+Shift+R" = "window-cycle-primary-extent-back"
"Mod+Ctrl+Shift+R" = "window-cycle-secondary-extent"
"Mod+Ctrl+R" = "window-set-secondary-extent:1.0"

"Alt+A" = "window-toggle-maximize"
"Alt+F" = "window-toggle-fullscreen"
"Mod+M" = "window-toggle-maximize-to-edges"
"Mod+C" = "column-center"

"Mod+Minus" = "window-modify-primary-extent:-0.1"
"Mod+Equal" = "window-modify-primary-extent:+0.1"
"Mod+Shift+Minus" = "window-modify-secondary-extent:-0.1"
"Mod+Shift+Equal" = "window-modify-secondary-extent:+0.1"

"Alt+Backslash" = "window-toggle-floating"
"Mod+Alt+Backslash" = "window-focus-switch-floating"
"Mod+W" = "column-toggle-tabbed"

# Capturas de pantalla
"Print" = { action = "spawn:noctalia msg screenshot-region", repeat = false }
"Ctrl+Print" = { action = "spawn:noctalia msg screenshot-screen", repeat = false }
"Alt+Print" = { action = "spawn:noctalia msg screenshot-window", repeat = false }
