config_version = 14

[bar.default]
end = [
    "media",
    "nix-monitor",
    "weather",
    "tray",
    "clipboard",
    "network",
    "bluetooth",
    "output_volume",
    "input_volume",
    "brightness",
    "battery",
    "control-center",
    "notifications",
    "session"
]
font_family = "JetBrainsMono Nerd Font Propo"
margin_edge = 10
margin_ends = 10
radius = 10
thickness = 28
widget_spacing = 8

[dock]
active_monitor_only = true
background_opacity = 0.84999998100101948
cross_axis_padding = 5
enabled = true
icon_size = 40
main_axis_padding = 10
margin_edge = 10
monitors = [ "HDMI-A-1" ]
radius = 10
reserve_space = false
show_dots = true
smart_auto_hide = true

[location]
address = "Cabudare"

[lockscreen_widgets]
enabled = false
schema_version = 2
widget_order = [ "lockscreen-login-box@HDMI-A-1" ]

    [lockscreen_widgets.grid]
    cell_size = 16
    major_interval = 4
    visible = true

    [lockscreen_widgets.widget."lockscreen-login-box@HDMI-A-1"]
    box_height = 196.0
    box_width = 810.0
    cx = 960.0
    cy = 898.0
    output = "HDMI-A-1"
    placement_height = 1080.0
    placement_width = 1920.0
    rotation = 0.0
    type = "login_box"

        [lockscreen_widgets.widget."lockscreen-login-box@HDMI-A-1".settings]
        background_color = "surface_variant"
        background_opacity = 0.88
        background_radius = 12.0
        center_password_text = false
        input_opacity = 1.0
        input_radius = 6.0
        layout = "regular"
        show_caps_lock = true
        show_keyboard_layout = true
        show_login_button = true
        show_media = true
        show_session_buttons = true
        show_unlock_hint = true
        show_weather = true

[notification]
offset_x = 9

[osd]
background_opacity = 0.96999997831881046
monitors = [ "HDMI-A-1" ]

[plugins]
enabled = [ "avivbintangaringga/nix-monitor" ]

[shell]
polkit_agent = true

    [shell.panel]
    open_near_click_control_center = true

    [shell.screenshot]
    annotate = true
    close_on_copy = false

[theme]
builtin = "Ayu"
community_palette = "Catppuccin Mocha Mauve-Lavender"
source = "community"
wallpaper_scheme = "m3-content"

    [theme.templates]
    builtin_ids = [ "btop", "foot", "gtk3", "gtk4", "hyprland", "kcolorscheme", "mango", "niri", "qt" ]
    community_ids = [ "pywalfox", "zen-browser", "libreoffice", "vscode", "zellij", "hyprtoolkit", "bat", "fzf", "lazygit" ]

[wallpaper]
directory = "/home/luzzio/dotfiles/wallpapers"

    [wallpaper.default]
    path = "/home/luzzio/dotfiles/wallpapers/juri-han-catppuccin-mocha.jpg"

    [wallpaper.last]
    path = "/home/luzzio/dotfiles/wallpapers/juri-han-catppuccin-mocha.jpg"

    [wallpaper.monitors.HDMI-A-1]
    path = "/home/luzzio/dotfiles/wallpapers/juri-han-catppuccin-mocha.jpg"

[widget.clock]
format = "{:%I:%M %p}"

[widget.media]
capsule = true
hide_when_no_media = true

[widget.network]
show_label = false

[widget.nix-monitor]
colorize_glyph = false
type = "avivbintangaringga/nix-monitor:nix-monitor"
up_to_date_glyph = "circle-check"

[widget.weather]
show_condition = false

[widget.workspaces]
focused_output_only = true
font_family = "JetBrainsMono Nerd Font Propo"
hide_when_empty = true